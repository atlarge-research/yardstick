---
- name: Deploy Telegraf
  gather_facts: true
  hosts: all
  tasks:
    - name: Create Telegraf directory
      file:
        path: "{{wd}}"
        state: directory
    - name: Download Telegraf
      unarchive:
        src: https://dl.influxdata.com/telegraf/releases/telegraf-1.30.3_linux_amd64.tar.gz
        dest: "{{wd}}"
        remote_src: true
        creates: "{{wd}}/telegraf-1.30.3_linux_amd64"
    - name: Copy Telegraf config
      template:
        src: "{{config_template}}"
        dest: "{{wd}}/telegraf-{{inventory_hostname}}.conf"
- name: Deploy Minecraft tick collection execd input script (only when Minecraft benchmarking is enabled)
  gather_facts: true
  hosts: minecraft_servers
  tasks:
    - name: Copy Minecraft tick collection input script
      copy:
        src: "{{jolokia_get_minecraft_tick_script_path}}"
        dest: "{{wd}}"
      when: jolokia_get_minecraft_tick_script_path is defined
      # If you're running a Luanti-only benchmark, the variable above won't be set
      # (because add_input_execd_minecraft_ticks wasn't called) and this task is skipped.
