---
- hosts: all
  gather_facts: True
  environment:
    DURATION: "{{duration}}"
    MC_HOST: "{{mc_host}}"
    SPAWN_X: "{{spawn_x}}"
    SPAWN_Y: "{{spawn_y}}"
    BOX_WIDTH: "{{box_width}}"
    BOX_X: "{{box_x}}"
    BOX_Z: "{{box_z}}"
    BOTS_JOIN_DELAY: "{{bots_join_delay}}"
    BOTS_PER_NODE: "{{bots_per_node}}"
    WORKER_BOT: "{{ worker_bot | default('walkaround_worker_bot.js') }}"
  tasks:
    - name: Set game spawn location
      shell:
        cmd: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          node set_spawn.js
        chdir: "{{wd}}"
      run_once: true # Only run on one machine
      ignore_errors: yes
    - name: Run Minecraft bot
      shell:
        cmd: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm use 18
          node workload_bot.js | tee bot-{{ inventory_hostname }}.log
          echo $! > bot-{{inventory_hostname}}.pid
        chdir: "{{wd}}"
      environment:
        BOT_INDEX: "{{ groups['all'].index(inventory_hostname) }}"
