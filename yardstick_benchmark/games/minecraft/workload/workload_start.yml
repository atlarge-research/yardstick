---
- hosts: all
  gather_facts: False
  environment:
    DURATION: "{{duration}}"
    MC_HOST: "{{mc_host}}"
    SPAWN_X: "{{spawn_x}}"
    SPAWN_Y: "{{spawn_y}}"
    BOX_WIDTH: "{{box_width}}"
    BOX_X: "{{box_x}}"
    BOX_Z: "{{box_z}}"
    BOTS_JOIN_DELAY: "{{bots_join_delay}}"
    BOTS_PER_NODE: "{{bots_per_node}}"
    WORKER_BOT: "{{ worker_bot | default('walkaround_worker_bot.js') }}"
  tasks:
    - name: Start Minecraft bots
      shell:
        cmd: |
          NODE=$(cat {{wd}}/.node_path 2>/dev/null || ls $HOME/.nvm/versions/node/v18*/bin/node 2>/dev/null | head -1 || echo node)
          echo "launch: NODE=$NODE cwd=$(pwd) at $(date -u +%s)" > bot-{{ inventory_hostname }}.log 2>&1
          setsid nohup $NODE workload_bot.js >> bot-{{ inventory_hostname }}.log 2>&1 </dev/null &
          echo $! > {{wd}}/bot.pid
          disown $! 2>/dev/null || true
          sleep 2
          echo "post-launch pid=$(cat {{wd}}/bot.pid) alive=$(kill -0 $(cat {{wd}}/bot.pid) 2>/dev/null && echo yes || echo no)" >> bot-{{ inventory_hostname }}.log 2>&1
        chdir: "{{wd}}"
      environment:
        BOT_INDEX: "{{ groups['all'].index(inventory_hostname) }}"

    - name: Wait for experiment duration
      pause:
        seconds: "{{ duration | int }}"
      run_once: true

    - name: Kill Minecraft bots
      shell:
        cmd: kill -9 $(cat {{wd}}/bot.pid 2>/dev/null) 2>/dev/null || true
        chdir: "{{wd}}"

    - name: Collect bot activity
      shell:
        cmd: |
          _f=/tmp/_bots_{{ inventory_hostname }}.log
          cat bot-*.log > $_f 2>/dev/null || true
          echo "node {{ inventory_hostname }}: $(wc -l < $_f 2>/dev/null) lines | chops=$(grep -c 'chopped log at' $_f 2>/dev/null) | mines=$(grep -c 'mined ore at' $_f 2>/dev/null)"
          echo "markers: spawned=$(grep -c 'spawned at' $_f 2>/dev/null) | worker_err=$(grep -c 'worker error' $_f 2>/dev/null) | no_resource=$(grep -c 'no wood within\|no ore within' $_f 2>/dev/null) | caught=$(grep -c 'caught error' $_f 2>/dev/null)"
          echo "--- first 5 lines ---"
          head -5 $_f 2>/dev/null || true
          echo "--- worker/biome/error samples ---"
          grep -hE 'spawned at|worker error|caught error|no wood within|no ore within|Error|kicked' $_f 2>/dev/null | head -8 || true
          true
        chdir: "{{wd}}"
      register: _bot_report

    - name: Bot activity
      debug:
        var: _bot_report.stdout_lines
