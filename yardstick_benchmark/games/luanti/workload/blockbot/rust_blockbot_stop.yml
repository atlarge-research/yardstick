---
- name: Stop Rust BlockBot bots
  hosts: all
  environment:
    TMPDIR: "{{ wd }}/tmp"
    TEMP: "{{ wd }}/tmp"
    TMP: "{{ wd }}/tmp"
  tasks:
    - name: Kill all blockbot processes
      shell: |
        # Kill cargo processes running blockbot
        pkill -f "cargo run.*blockbot" || true
        
        # Kill any remaining blockbot binaries
        pkill -f "blockbot" || true
        
        # Wait a moment for processes to die
        sleep 2
        
        # Force kill if necessary
        pkill -9 -f "cargo run.*blockbot" || true
        pkill -9 -f "blockbot" || true
        
        echo "All blockbot processes stopped"
    - name: Fetch bot logs
      fetch:
        src: "/tmp/blockbot_{{ inventory_hostname }}.log"
        dest: "./logs/"
        flat: yes
      ignore_errors: yes
      
    - name: Clean up log files
      shell: |
        rm -f /tmp/blockbot_*_{{ inventory_hostname }}.log
        echo "Cleaned up blockbot log files"