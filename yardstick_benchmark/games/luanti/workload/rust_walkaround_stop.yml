---
- name: Stop Rust WalkAround bots
  hosts: all
  environment:
    TMPDIR: "{{ wd }}/tmp"
    TEMP: "{{ wd }}/tmp"
    TMP: "{{ wd }}/tmp"
  tasks:
    - name: Kill walkbot processes
      shell: |
        pkill -f "multi_walkbot" || true
        pkill -f "walkbot" || true
      ignore_errors: yes

    - name: Wait for processes to terminate
      pause:
        seconds: 3

    - name: Fetch bot logs
      fetch:
        src: "/tmp/walkbot_{{ inventory_hostname }}.log"
        dest: "./logs/"
        flat: yes
      ignore_errors: yes

    - name: Note interaction latency feature
      debug:
        msg: "Interaction latency feature uses in-process env vars; no separate teardown required."
      when: interaction_latency_enabled | default(false)
