---
- name: Cleanup Rust WalkAround bots
  hosts: all
  environment:
    TMPDIR: "{{ wd }}/tmp"
    TEMP: "{{ wd }}/tmp"
    TMP: "{{ wd }}/tmp"
  tasks:
    - name: Remove bot log files
      shell: |
        rm -f /tmp/walkbot_*_{{ inventory_hostname }}.log || true
      ignore_errors: yes

    - name: Clean cargo build cache (optional)
      shell: |
        source ~/.cargo/env
        cargo clean
      args:
        chdir: "{{ texmodbot_path }}"
      environment:
        CARGO_HOME: ~/.cargo
      ignore_errors: yes

    - name: Interaction latency cleanup note
      debug:
        msg: "All interaction logs removed with bot logs; no additional artifacts."
      when: interaction_latency_enabled | default(false)
