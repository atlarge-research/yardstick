---
- name: Deploy Pre-compiled Luanti Server
  gather_facts: true
  hosts: all
  become: no
  vars:
    lib_source_path: "/var/scratch/aco237/luanti_headless"
    headless_source: "/var/scratch/aco237/luanti_headless"
  tasks:
    - name: Create working directory and subdirectories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      with_items:
        - "{{ wd }}"
        - "{{ wd }}/lib"
        - "{{ wd }}/logs"
        - "{{ wd }}/games"
        - "{{ wd }}/builtin"
        - "{{ wd }}/worlds/benchmark"
        - "{{ wd }}/worlds/benchmark/worldmods"  # ADD: Ensure worldmods directory exists

    - name: Copy required shared libraries from node
      shell: |
        # Copy jsoncpp library - check multiple locations
        COPIED=false
        
        # Check on the NODE (not source system)
        if [ -f "/usr/lib64/libjsoncpp.so.19" ]; then
          cp "/usr/lib64/libjsoncpp.so.19" "{{ wd }}/lib/"
          echo "✓ Copied jsoncpp library from /usr/lib64/ (node)"
          COPIED=true
        elif [ -f "/lib64/libjsoncpp.so.19" ]; then
          cp "/lib64/libjsoncpp.so.19" "{{ wd }}/lib/"
          echo "✓ Copied jsoncpp library from /lib64/ (node)"
          COPIED=true
        fi
        
        # Copy GCC libraries if they exist on the node
        for lib in libatomic.so.1 libstdc++.so.6 libgcc_s.so.1; do
          if [ -f "/opt/ohpc/pub/compiler/gcc/12.4.0/lib64/$lib" ]; then
            cp "/opt/ohpc/pub/compiler/gcc/12.4.0/lib64/$lib" "{{ wd }}/lib/"
            echo "✓ Copied $lib"
          fi
        done
        
        echo "Found libs in {{ wd }}/lib:"
        ls -la "{{ wd }}/lib/"
      register: node_lib_copy
      ignore_errors: yes

    - name: Upload jsoncpp from source system if not found on node
      copy:
        src: "/usr/lib64/libjsoncpp.so.19"
        dest: "{{ wd }}/lib/"
        mode: "0755"
      when: "'libjsoncpp.so.19' not in node_lib_copy.stdout"
      ignore_errors: yes
      
    - name: Copy pre-compiled server binary
      copy:
        src: "{{ headless_source }}/luantiserver"
        dest: "{{ wd }}/luantiserver"
        mode: "0755"

    - name: Copy configuration file
      copy:
        src: "{{ headless_source }}/luanti.conf"
        dest: "{{ wd }}/luanti.conf"
        mode: "0644"

    # ADD: Copy the working world.mt with yardstick_collector enabled
    - name: Copy world.mt with yardstick_collector configuration
      copy:
        src: "{{ headless_source }}/worlds/benchmark/world.mt"
        dest: "{{ wd }}/worlds/benchmark/world.mt"
        mode: "0644"

    # ADD: Copy worldmods directory (contains yardstick_collector)
    - name: Copy worldmods directory with yardstick_collector
      shell: |
        if [ -d "{{ headless_source }}/worlds/benchmark/worldmods" ]; then
          rsync -av "{{ headless_source }}/worlds/benchmark/worldmods/" "{{ wd }}/worlds/benchmark/worldmods/"
          echo "✓ Copied worldmods directory with yardstick_collector"
          ls -la "{{ wd }}/worlds/benchmark/worldmods/"
        else
          echo "⚠ No worldmods directory found in source"
        fi
      register: worldmods_copy

    # ADD: Copy mod_storage directory if it exists (preserves previous metrics)
    - name: Copy mod_storage directory if exists
      shell: |
        if [ -d "{{ headless_source }}/worlds/benchmark/mod_storage" ]; then
          rsync -av "{{ headless_source }}/worlds/benchmark/mod_storage/" "{{ wd }}/worlds/benchmark/mod_storage/"
          echo "✓ Copied mod_storage directory"
        else
          echo "ℹ No existing mod_storage directory (will be created by mod)"
        fi
      register: mod_storage_copy

    - name: Copy minetest_game with extra ordinance
      shell: |
        # First try to copy minetest_game
        if [ -d "{{ headless_source }}/games/minetest_game" ]; then
          rsync -av "{{ headless_source }}/games/minetest_game/" "{{ wd }}/games/minetest_game/"
          echo "✓ Copied minetest_game files"
        else
          echo "✗ minetest_game directory not found at {{ headless_source }}/games/minetest_game"
        fi
        
        # Also copy extra ordinance if it exists
        if [ -d "{{ headless_source }}/games/extra_ordinance" ]; then
          rsync -av "{{ headless_source }}/games/extra_ordinance/" "{{ wd }}/games/extra_ordinance/"
          echo "✓ Copied extra_ordinance files"
        else
          echo "⚠ extra_ordinance directory not found (optional)"
        fi
        
        # Show what games we have
        echo "Available games:"
        ls -la "{{ wd }}/games/"
      register: game_copy
      ignore_errors: yes

    - name: Verify libraries are properly linked
      shell: |
        cd "{{ wd }}"
        export LD_LIBRARY_PATH="{{ wd }}/lib:/usr/lib64:/lib64:/opt/ohpc/pub/compiler/gcc/12.4.0/lib64:$LD_LIBRARY_PATH"
        echo "Library directory contents:"
        ls -la "{{ wd }}/lib/"
        echo "Library dependencies:"
        ldd ./luantiserver | grep jsoncpp || echo "No jsoncpp found in ldd output"
      register: lib_verification
      ignore_errors: yes

    # ADD: Verify yardstick_collector mod deployment
    - name: Verify yardstick_collector mod deployment
      shell: |
        cd "{{ wd }}"
        echo "=== WORLD.MT CONFIGURATION ==="
        cat worlds/benchmark/world.mt
        echo ""
        echo "=== WORLDMODS DIRECTORY ==="
        ls -la worlds/benchmark/worldmods/ 2>/dev/null || echo "No worldmods directory"
        echo ""
        echo "=== YARDSTICK_COLLECTOR MOD ==="
        if [ -d "worlds/benchmark/worldmods/yardstick_collector" ]; then
          echo "✓ yardstick_collector mod found"
          ls -la worlds/benchmark/worldmods/yardstick_collector/
        else
          echo "❌ yardstick_collector mod missing"
        fi
      register: yardstick_verification

    - name: Display library verification
      debug:
        var: lib_verification.stdout_lines

    - name: Display yardstick verification
      debug:
        var: yardstick_verification.stdout_lines

    - name: Display deployment summary
      debug:
        msg: |
          Server deployment summary:
          - Working directory: {{ wd }}
          - Server binary: {{ 'FOUND' if server_check.stat.exists else 'MISSING' }}
          - Libraries: {{ 'VERIFIED' if 'libjsoncpp.so.19' in lib_verification.stdout else 'ISSUE DETECTED' }}
          - Game files: {{ 'COPIED' if 'Copied minetest_game files' in game_copy.stdout else 'ISSUE DETECTED' }}
          - Worldmods: {{ 'COPIED' if 'Copied worldmods directory' in worldmods_copy.stdout else 'MISSING' }}
          - Yardstick mod: {{ 'VERIFIED' if 'yardstick_collector mod found' in yardstick_verification.stdout else 'MISSING' }}
      vars:
        server_check:
          stat:
            exists: "{{ lookup('file', wd + '/luantiserver', errors='ignore') != '' }}"