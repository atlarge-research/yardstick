[project]
name = "yardstick-benchmark"
version = "0.1.1"
description = ""
authors = [{ name = "Jesse Donkervliet", email = "j.donkervliet@gmail.com" }]
requires-python = ">=3.9,<4"
readme = "README.md"
dependencies = [
    "influxdb-client>=1.50.0",
    "jinja2>=3,<4",
    "plumbum>=1.8.2,<2",
]

[project.optional-dependencies]
# Install with: `uv sync --extra notebooks` (or `uv pip install
# yardstick-benchmark[notebooks]` from PyPI). Required to run the
# experiment notebooks under experiments/.
notebooks = [
    "matplotlib>=3.7",
    "pandas>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Ship the Jolokia Java agent jar in the wheel even though *.jar is
# gitignored; MinecraftServer bind-mounts it into the upstream itzg image
# at start time, so users don't need a custom container.
artifacts = [
    "yardstick_benchmark/games/minecraft/server/jolokia-agent-jvm-*.jar",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
markers = [
    "slow: integration tests that start real apptainer instances; skipped by default with '-m \"not slow\"'",
]
