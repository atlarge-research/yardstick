[project]
name = "yardstick-benchmark"
version = "0.1.1"
description = ""
authors = [{ name = "Jesse Donkervliet", email = "j.donkervliet@gmail.com" }]
requires-python = ">=3.9,<4"
readme = "README.md"
dependencies = [
    "ansible-runner>=2.3.3,<3",
    "ansible>=8.0.0,<9",
    "influxdb-client>=1.50.0",
    "plumbum>=1.8.2,<2",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
markers = [
    "slow: integration tests that start real apptainer instances; skipped by default with '-m \"not slow\"'",
]
